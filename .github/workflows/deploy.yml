# Deploy application: builds the site from main and deploys the Worker.
#
# Application releases only. Live data does not go through here: it is
# refreshed in Workers KV by "Live data → KV", with no build and no deploy.
# Manual, and the `preview` environment requires the maintainer's approval,
# so a token that can dispatch workflows cannot deploy on its own.
name: Deploy application

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-application
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:cloudflare
      - name: Cloudflare output smoke check
        run: node scripts/release/cloudflare-check.ts

      - name: Check the shape of the Cloudflare credentials (values are never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
          const checks = [
            ["token is present", token.length > 0],
            ["token has no whitespace or line break", !/\s/.test(token)],
            ["token has only letters, digits, _ and -", /^[A-Za-z0-9_-]*$/.test(token)],
            ["token does not start with Bearer", !/^bearer/i.test(token)],
            ["token is 30 to 200 characters", token.length >= 30 && token.length <= 200],
            ["account id is 32 hex characters", /^[0-9a-f]{32}$/.test(account)],
          ];
          for (const [name, ok] of checks) console.log(`${ok ? "ok  " : "FAIL"} ${name}`);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          JS

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.137.0 deploy

      - name: Check the production site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://datos.tn242.com/)
          echo "GET https://datos.tn242.com/ -> $code"
          test "$code" = "200"
